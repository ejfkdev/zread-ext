name: release

# 打 tag（v0.1.5 或 0.1.5）即触发：校验 tag 与仓库版本一致 → 构建 →
# 产出 store zip + CRX（需 secret CRX_PRIVATE_KEY）→ 建 GitHub Release 上传产物。
on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch: # 手动触发验证构建（不创建 Release）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      # secrets 不能直接用在 if 条件里，先经 env 中转
      HAS_CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史 tag 生成 changelog

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun global package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Check tag matches repo version
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG_VERSION="${TAG#v}"
            if ! printf '%s' "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
              echo "::error::tag '$TAG' is not semver (expected like v0.1.5)"; exit 1
            fi
            PKG_VERSION="$(node -p "require('./package.json').version")"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::tag version $TAG_VERSION != package.json version $PKG_VERSION. Bump the version (bun run version:sync $TAG_VERSION), commit and re-tag."
              exit 1
            fi
          else
            # 手动触发（workflow_dispatch）：用仓库当前版本构建，不创建 Release
            TAG_VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (chromium)
        run: bun run build

      - name: Package store zip
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cd dist/chromium
          zip -r "../../zread-github-ext-${VER}.zip" . -x '_metadata/*' -x '*.DS_Store'
          cd ../..
          unzip -l "zread-github-ext-${VER}.zip" | head -20

      - name: Pack CRX
        if: env.HAS_CRX_KEY == 'true'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          printf '%s\n' "${{ secrets.CRX_PRIVATE_KEY }}" > /tmp/crx-key.pem
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --pack-extension="$PWD/dist/chromium" \
            --pack-extension-key=/tmp/crx-key.pem
          mv dist/chromium.crx "zread-github-ext-${VER}.crx"
          rm -f /tmp/crx-key.pem
          ls -la "zread-github-ext-${VER}.crx"

      - name: Warn when CRX key missing
        if: env.HAS_CRX_KEY == 'false'
        run: echo "::warning::secret CRX_PRIVATE_KEY not set — skipping CRX packaging (zip only). See RELEASE.md."

      - name: Checksums
        run: |
          VER="${{ steps.ver.outputs.version }}"
          sha256sum "zread-github-ext-${VER}.zip" "zread-github-ext-${VER}.crx" 2>/dev/null > SHA256SUMS.txt || \
          sha256sum "zread-github-ext-${VER}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          FILES="zread-github-ext-${VER}.zip"
          [ -f "zread-github-ext-${VER}.crx" ] && FILES="$FILES zread-github-ext-${VER}.crx"
          FILES="$FILES SHA256SUMS.txt"
          gh release create "$TAG" $FILES \
            --title "v${VER}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
